<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運動課程打卡</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>
  :root { --c:#0b7a5a; --c2:#e6f4ef; --bd:#e1e6e4; --tx:#1f2a27; --mu:#6b7a75; --red:#c0392b; --bg:#f4f6f5; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--tx); font-size:16px; padding-bottom:76px; }
  header { background:var(--c); color:#fff; padding:16px 16px 14px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header .sub { font-size:13px; opacity:.85; margin-top:2px; }
  main { padding:14px 16px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:14px; padding:14px; margin-bottom:12px; }
  .card h3 { margin:0 0 4px; font-size:16px; }
  .mu { color:var(--mu); font-size:13px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eef1f0; color:var(--mu); vertical-align:middle; }
  .t-出席,.t-上課中,.t-已開課 { background:#e3f5ec; color:#11704b; } .t-停課,.t-缺席,.t-未成團 { background:#fbe7e5; color:var(--red); }
  .t-未打卡,.t-招生中 { background:#fff0d6; color:#a25f00; }
  .punch { display:grid; grid-template-columns:1fr; margin-top:12px; }
  .pbtn { border:0; border-radius:12px; padding:14px 6px; font-size:16px; font-weight:600; background:var(--c); color:#fff; }
  .pbtn:disabled { background:#e5e9e8; color:#8a9692; font-weight:500; }
  .pbtn small { display:block; font-size:12px; font-weight:400; margin-top:3px; }
  .b { border:0; border-radius:10px; padding:10px 14px; font-size:15px; background:var(--c); color:#fff; }
  .b.g { background:#fff; color:var(--c); border:1px solid var(--c); }
  .b.r { background:#fff; color:var(--red); border:1px solid var(--red); }
  .b:disabled { opacity:.5; }
  input { width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--bd); border-radius:10px; margin:6px 0 12px; }
  .tabs { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--bd); display:flex; padding-bottom:env(safe-area-inset-bottom); }
  .tabs button { flex:1; border:0; background:none; padding:12px 0 10px; font-size:14px; color:var(--mu); }
  .tabs button.on { color:var(--c); font-weight:600; }
  .tabs i { display:block; font-style:normal; font-size:20px; line-height:1.1; }
  .sum { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .sum div { background:#fff; border:1px solid var(--bd); border-radius:12px; padding:10px; text-align:center; }
  .sum b { display:block; font-size:22px; color:var(--c); }
  .sum span { font-size:12px; color:var(--mu); }
  .li { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--bd); gap:8px; }
  .li:last-child { border-bottom:0; }
  .empty { text-align:center; color:var(--mu); padding:30px 10px; }
  #toast { position:fixed; left:16px; right:16px; bottom:90px; background:#222; color:#fff; padding:12px 14px; border-radius:10px; z-index:9; display:none; text-align:center; }
  #toast.err { background:var(--red); } #toast.ok { background:var(--c); }
  .row { display:flex; gap:8px; align-items:center; }
  .hide { display:none !important; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
  .chips span { font-size:12px; background:var(--c2); color:var(--c); border-radius:6px; padding:2px 6px; }
  header { position:relative; }
  .nbtn { position:absolute; right:12px; top:14px; background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:16px; padding:6px 10px; font-size:13px; }
  .sess { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--bd); }
  .sess:last-child { border-bottom:0; }
  .sess input[type=checkbox] { width:22px; height:22px; margin:0; flex:none; }
  .sess .grow { flex:1; min-width:0; }
  .names { font-size:13px; color:var(--tx); background:var(--bg); border-radius:8px; padding:6px 8px; margin-top:6px; line-height:1.6; }
  .names span { display:inline-block; margin-right:10px; white-space:nowrap; }
  .names em { font-style:normal; color:var(--mu); font-size:12px; }
  .btns { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btns .b { flex:1; }
  #notice { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:none; align-items:flex-end; }
  #notice .box { background:#fff; width:100%; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0; padding:18px 16px calc(16px + env(safe-area-inset-bottom)); }
  #notice h3 { margin:0 0 10px; font-size:17px; }
  #notice ol { margin:0 0 14px; padding-left:22px; line-height:1.65; font-size:15px; }
  #notice li { margin-bottom:6px; }
</style>
</head>
<body>
<header><h1>運動課程打卡</h1><div class="sub" id="sub">載入中…</div><button class="nbtn hide" id="nbtn">📋 注意事項</button></header>
<main id="app"><div class="empty">載入中…</div></main>
<nav class="tabs hide" id="tabs">
  <button data-t="home" class="on"><i>⏱</i>打卡</button>
  <button data-t="courses"><i>✍️</i>報名</button>
  <button data-t="opened"><i>👥</i>開課名單</button>
  <button data-t="history"><i>📊</i>我的紀錄</button>
</nav>
<div id="toast"></div>
<div id="notice"><div class="box"><h3>員工運動課程注意事項</h3><ol id="nlist"></ol>
  <button class="b" id="nok" style="width:100%">我已閱讀</button></div></div>

<script>
/* ===================== 設定（部署時修改這兩行） ===================== */
const LIFF_ID = '2012537462-TilDY25G';
const API_URL = 'https://script.google.com/macros/s/AKfycbw_habqGuSHhLJ2KmI2BmXX-AOvUp_HXn4CyyhgDF5xNX96vczCK2Z28lXN6Hll8hc/exec';
/* =================================================================== */

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const WD = ['日','一','二','三','四','五','六'];
const wd = d => WD[new Date(d + 'T12:00:00+08:00').getUTCDay()];
const money = n => (Number(n) || 0).toLocaleString('zh-TW');
const todayStr = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const params = new URLSearchParams(location.search);
const TEST_ID = params.get('test'); // 測試模式：?test=員工LINE測試代號（後台「測試模式」需設為「是」）
let ID_TOKEN = null, CONFIG = {}, ME = null, TAB = 'home', NOTICE = [], NOTICE_READ = false;

function toast(msg, type) {
  const t = $('#toast'); t.textContent = msg; t.className = type || ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', type === 'err' ? 5000 : 2800);
}

async function api(action, data) {
  const body = Object.assign({ action, idToken: ID_TOKEN, testUserId: TEST_ID || undefined }, data || {});
  let r;
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    r = await res.json();
  } catch (e) { throw new Error('網路連線失敗，請稍後再試'); }
  if (!r.ok) {
    if (r.code === 'TOKEN_EXPIRED' && window.liff && !TEST_ID) { liff.logout(); liff.login({ redirectUri: location.href }); }
    if (r.code === 'NOT_BOUND') { showBind(); }
    const err = new Error(r.error); err.code = r.code; throw err;
  }
  return r.data;
}

async function init() {
  try {
    if (!TEST_ID) {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      ID_TOKEN = liff.getIDToken();
    }
    const me = await api('me');
    CONFIG = me.config || {};
    NOTICE = me.notice || []; NOTICE_READ = !!me.noticeRead;
    if (!me.bound) { $('#sub').textContent = (me.lineName || '') + '，請先完成註冊'; showBind(); return; }
    setMe(me.employee);
    show('home');
  } catch (e) {
    app.innerHTML = `<div class="card"><h3>無法開啟</h3><div class="mu">${esc(e.message)}</div></div>`;
  }
}
function setMe(emp) { ME = emp; $('#sub').textContent = `${emp.name}（${emp.empId}）${emp.dept ? '｜' + emp.dept : ''}`; $('#tabs').classList.remove('hide'); $('#nbtn').classList.remove('hide'); }

/* ---------- 注意事項 ---------- */
// 按右上角按鈕可隨時查看；第一次報名前必須按「我已閱讀」
function showNotice(mustAck) {
  return new Promise(resolve => {
    $('#nlist').innerHTML = NOTICE.length ? NOTICE.map(l => `<li>${esc(l)}</li>`).join('') : '<li>（管理者尚未設定注意事項）</li>';
    const ok = $('#nok');
    ok.textContent = mustAck ? '我已閱讀，繼續報名' : (NOTICE_READ ? '關閉' : '我已閱讀');
    $('#notice').style.display = 'flex';
    $('#notice').onclick = e => { if (e.target.id === 'notice' && !mustAck) { $('#notice').style.display = 'none'; resolve(false); } };
    ok.onclick = async () => {
      if (!NOTICE_READ) {
        ok.disabled = true;
        try { await api('ackNotice'); NOTICE_READ = true; } catch (e) { toast(e.message, 'err'); ok.disabled = false; return; }
        ok.disabled = false;
      }
      $('#notice').style.display = 'none'; resolve(true);
    };
  });
}
$('#nbtn').onclick = () => showNotice(false);
async function ensureNotice() { if (NOTICE_READ) return true; return showNotice(true); }

/* ---------- 綁定 ---------- */
function showBind() {
  $('#tabs').classList.add('hide');
  app.innerHTML = `<div class="card"><h3>註冊員工資料</h3>
    <div class="mu" style="margin-bottom:10px">第一次使用請填寫以下資料，完成後這支手機的 LINE 就能打卡。請填寫本人的員工編號，每個員工編號只能註冊一次；換手機請洽管理者。</div>
    <label class="mu">員工編號（5 碼數字）</label><input id="bi" autocomplete="off" inputmode="numeric" maxlength="5" pattern="\\d{5}">
    <label class="mu">姓名</label><input id="bn" autocomplete="off" maxlength="20">
    <label class="mu">單位（選填）</label><input id="bd" autocomplete="off" maxlength="30">
    <button class="b" id="bb" style="width:100%">送出註冊</button></div>`;
  $('#bb').onclick = async () => {
    const empId = $('#bi').value.trim(), name = $('#bn').value.trim();
    if (!/^\d{5}$/.test(empId)) return toast('員工編號需為 5 碼數字', 'err');
    if (!name) return toast('請輸入姓名', 'err');
    if (!confirm(`請確認資料正確：\n員工編號：${empId}\n姓名：${name}\n\n送出後如需修改請洽管理者。`)) return;
    $('#bb').disabled = true;
    try {
      const r = await api('bind', { empId, name, dept: $('#bd').value.trim() }); setMe(r.employee); toast('註冊成功', 'ok');
      const me = await api('me'); NOTICE = me.notice || []; NOTICE_READ = !!me.noticeRead;
      show('home'); if (!NOTICE_READ) showNotice(false);
    }
    catch (e) { if (e.code !== 'NOT_BOUND') toast(e.message, 'err'); $('#bb').disabled = false; }
  };
}

/* ---------- 分頁 ---------- */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => show(b.dataset.t));
function show(t) {
  TAB = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  window.scrollTo(0, 0);
  ({ home: viewHome, courses: viewCourses, opened: viewOpened, history: viewHistory })[t]();
}

/* ---------- 打卡 ---------- */
async function viewHome() {
  app.innerHTML = '<div class="empty">載入中…</div>';
  try {
    const d = await api('home');
    if (!d.sessions.length) { app.innerHTML = '<div class="empty">近兩週沒有您的課程<br><br><button class="b g" onclick="show(\'courses\')">去報名課程</button></div>'; return; }
    const t = todayStr();
    app.innerHTML = d.sessions.map(s => `
      <div class="card">
        <div class="row" style="justify-content:space-between"><h3>${esc(s.courseName)}</h3>${homeTag(s)}</div>
        <div class="mu">${s.date === t ? '<b style="color:var(--c)">今天</b>' : s.date}（${wd(s.date)}）${s.start}–${s.end}${s.location ? '｜' + esc(s.location) : ''}</div>
        ${s.note ? `<div class="mu">${esc(s.note)}</div>` : ''}
        <div class="punch">
          <button class="pbtn" data-p="${s.sessionId}" ${s.canIn ? '' : 'disabled'}>上課打卡<small>${s.inTime ? '✓ 已打卡 ' + s.inTime.slice(11, 16) : esc(s.hint)}</small></button>
        </div>
        <div class="mu" style="margin-top:8px">${s.cancelled ? '' : `打卡時間 ${s.windowText}・`}名單 ${s.rosterCount} 人${s.minCount ? '（' + s.minCount + ' 人開課）' : ''}${s.cancelled ? '' : `・每人分攤約 ${money(s.share)} 元`}</div>
      </div>`).join('');
    app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => punch(b));
  } catch (e) { if (e.code !== 'NOT_BOUND') app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function homeTag(s) {
  if (s.cancelled) return `<span class="tag t-${s.open === '未成團' ? '未成團' : '停課'}">${esc(s.cancelText || s.status)}</span>`;
  if (s.open === '招生中') return `<span class="tag t-招生中">尚未達開課人數</span>`;
  return s.status !== '未開始' ? `<span class="tag t-${esc(s.status)}">${esc(s.status)}</span>` : '<span class="tag t-已開課">已開課</span>';
}

function namesHtml(names) {
  if (!names || !names.length) return '';
  return `<div class="names">${names.map(n => `<span>${esc(n.name)}${n.dept ? ' <em>' + esc(n.dept) + '</em>' : ''}</span>`).join('')}</div>`;
}

function getPosition() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('此手機不支援定位'));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => {
      rej(new Error(e.code === 1 ? '請允許 LINE 使用定位權限（設定 > LINE > 位置）後再試' : '無法取得定位，請到空曠處或開啟 GPS 後再試'));
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

async function punch(btn) {
  const sessionId = btn.dataset.p, type = 'in';
  const label = btn.firstChild.textContent;
  btn.disabled = true; btn.firstChild.textContent = '定位中…';
  try {
    let pos = {};
    if (CONFIG.needLocation) { const c = await getPosition(); pos = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy }; }
    btn.firstChild.textContent = '送出中…';
    const r = await api('punch', Object.assign({ sessionId, type }, pos));
    toast(r.message, 'ok');
    viewHome();
  } catch (e) {
    toast(e.message, 'err'); btn.disabled = false; btn.firstChild.textContent = label;
  }
}

/* ---------- 報名 ---------- */
// 每門課列出本期可報名的場次：可「報名整期」或勾選單堂；報名後不可自行取消
async function viewCourses() {
  app.innerHTML = '<div class="empty">載入中…</div>';
  try {
    const d = await api('courses');
    if (!d.courses.length) { app.innerHTML = '<div class="empty">目前沒有開放報名的課程</div>'; return; }
    app.innerHTML = `<div class="mu" style="margin:0 2px 10px">⚠️ 報名後不可取消，無法上課請找同事代課，或先把費用交給班長。<a href="#" id="nlink">看注意事項</a></div>` +
      d.courses.map(c => {
        const left = c.sessions.filter(s => !s.mine && !s.full);
        return `<div class="card" data-c="${c.courseId}">
        <div class="row" style="justify-content:space-between"><h3>${esc(c.name)}</h3>
          ${c.mineCount ? `<span class="tag t-出席">已報 ${c.mineCount} 堂</span>` : ''}</div>
        <div class="mu">${c.teacher ? '老師：' + esc(c.teacher) : ''}${c.location ? '｜' + esc(c.location) : ''}</div>
        <div class="mu">每堂 ${money(c.fee)} 元，依人數均分（無條件進位）${c.minCount ? `｜${c.minCount} 人以上開課` : ''}</div>
        ${c.deadline ? `<div class="mu">報名截止：${esc(c.deadline.replace('T', ' '))}</div>` : ''}
        <div style="margin-top:8px">${c.sessions.map(s => `
          <div class="sess">
            ${s.mine ? '<span style="width:22px;text-align:center;color:var(--c)">✓</span>'
              : `<input type="checkbox" value="${s.sessionId}" ${s.full ? 'disabled' : ''}>`}
            <div class="grow">
              <div>${s.date.slice(5).replace('-', '/')}（${wd(s.date)}）${s.start}–${s.end}${s.mine ? ' <span class="mu">已報名</span>' : ''}</div>
              <div class="mu">${s.count}${c.minCount ? ' / ' + c.minCount : ''} 人${s.full ? '・額滿' : ''}${s.open === '已開課' && s.count ? `・每人約 ${money(s.share)} 元` : ''}
                ${s.names.length ? `・<a href="#" data-n="${s.sessionId}">看名單</a>` : ''}</div>
              <div class="hide" id="n_${s.sessionId}">${namesHtml(s.names)}</div>
            </div>
            <span class="tag t-${esc(s.open)}">${esc(s.open)}</span>
          </div>`).join('')}</div>
        ${left.length ? `<div class="btns">
          <button class="b g" data-pick="${c.courseId}">報名勾選的場次</button>
          <button class="b" data-all="${c.courseId}">報名整期（${left.length} 堂）</button></div>` : ''}
      </div>`; }).join('');
    $('#nlink').onclick = e => { e.preventDefault(); showNotice(false); };
    app.querySelectorAll('[data-n]').forEach(a => a.onclick = e => { e.preventDefault(); $('#n_' + a.dataset.n).classList.toggle('hide'); });
    const enroll = async (btn, payload, text) => {
      if (!(await ensureNotice())) return;
      if (!confirm(text + '\n\n報名後不可取消，確定報名？')) return;
      btn.disabled = true;
      try { const r = await api('enroll', payload); toast(r.message, 'ok'); viewCourses(); }
      catch (e) { if (e.code === 'NEED_NOTICE') NOTICE_READ = false; toast(e.message, 'err'); btn.disabled = false; }
    };
    app.querySelectorAll('[data-all]').forEach(b => b.onclick = () => {
      const c = d.courses.find(x => x.courseId === b.dataset.all);
      enroll(b, { courseId: c.courseId, all: true }, `${c.name}\n報名整期，共 ${c.sessions.filter(s => !s.mine && !s.full).length} 堂`);
    });
    app.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      const card = b.closest('.card');
      const ids = [...card.querySelectorAll('input[type=checkbox]:checked')].map(i => i.value);
      if (!ids.length) return toast('請先勾選要報名的場次', 'err');
      const c = d.courses.find(x => x.courseId === b.dataset.pick);
      const dates = c.sessions.filter(s => ids.includes(s.sessionId)).map(s => s.date.slice(5).replace('-', '/')).join('、');
      enroll(b, { courseId: c.courseId, sessionIds: ids }, `${c.name}\n報名：${dates}`);
    });
  } catch (e) { if (e.code !== 'NOT_BOUND') app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- 開課名單（所有員工都看得到） ---------- */
async function viewOpened() {
  app.innerHTML = '<div class="empty">載入中…</div>';
  try {
    const d = await api('opened');
    if (!d.sessions.length) { app.innerHTML = '<div class="empty">近 30 天沒有已開課的場次</div>'; return; }
    const t = todayStr();
    app.innerHTML = `<div class="mu" style="margin:0 2px 10px">近 30 天已確定開課的場次與名單</div>` + d.sessions.map(s => `
      <div class="card">
        <div class="row" style="justify-content:space-between"><h3>${esc(s.courseName)}</h3>
          <span class="tag t-${s.open === '停課' ? '停課' : '已開課'}">${esc(s.open === '停課' ? s.cancelText : '已開課')}</span></div>
        <div class="mu">${s.date === t ? '<b style="color:var(--c)">今天</b>' : s.date}（${wd(s.date)}）${s.start}–${s.end}${s.teacher ? '｜' + esc(s.teacher) : ''}${s.location ? '｜' + esc(s.location) : ''}</div>
        ${s.open === '停課' ? '' : `<div class="mu">共 ${s.count} 人・每人約 ${money(s.share)} 元</div>${namesHtml(s.names)}`}
      </div>`).join('');
  } catch (e) { if (e.code !== 'NOT_BOUND') app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* ---------- 我的紀錄 ---------- */
async function viewHistory(from, to) {
  const t = todayStr();
  from = from || t.slice(0, 8) + '01'; to = to || t;
  app.innerHTML = '<div class="empty">載入中…</div>';
  try {
    const d = await api('history', { from, to });
    const s = d.summary;
    app.innerHTML = `
      <div class="card"><div class="row"><input type="date" id="hf" value="${d.from}" style="margin:0"><span>～</span><input type="date" id="ht" value="${d.to}" style="margin:0"></div>
        <div class="row" style="margin-top:8px"><button class="b g" id="hm">本月</button><button class="b g" id="hp">上個月</button><button class="b" id="hq" style="margin-left:auto">查詢</button></div></div>
      <div class="sum"><div><b>${s.attended}</b><span>出席次數</span></div><div><b>${s.absent}</b><span>缺席</span></div><div><b>${money(s.fee)}</b><span>費用（元）</span></div></div>
      <div class="card">${d.details.length ? d.details.map(x => `
        <div class="li"><div><div>${esc(x.courseName)}</div><div class="mu">${x.date}（${wd(x.date)}）${x.start}–${x.end}
          ${x.inTime ? `<br>打卡 ${x.inTime.slice(11, 16)}` : ''}</div></div>
          <div style="text-align:right"><span class="tag t-${esc(x.status)}">${esc(x.status)}</span><div class="mu">${x.fee ? money(x.fee) + ' 元' : ''}</div></div></div>`).join('')
        : '<div class="empty">這段期間沒有上課紀錄</div>'}</div>
      <div class="mu" style="text-align:center">費用＝每堂費用 ÷ 名單人數（無條件進位），打卡時間結束後才結算</div>`;
    $('#hq').onclick = () => viewHistory($('#hf').value, $('#ht').value);
    $('#hm').onclick = () => viewHistory(t.slice(0, 8) + '01', t);
    $('#hp').onclick = () => {
      const d0 = new Date(t.slice(0, 8) + '01T12:00:00+08:00'); d0.setUTCDate(0);
      const last = d0.toISOString().slice(0, 10); viewHistory(last.slice(0, 8) + '01', last);
    };
  } catch (e) { if (e.code !== 'NOT_BOUND') app.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

init();
</script>
</body>
</html>
